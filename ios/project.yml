# YZ Gündemi iOS uygulaması: Xcode projesi bu dosyadan üretilir (XcodeGen).
#   brew install xcodegen && cd ios && xcodegen && open YZGundemi.xcodeproj
name: YZGundemi
options:
  bundleIdPrefix: com.yzgundemi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  YZGundemi:
    type: application
    platform: iOS
    sources:
      - path: YZGundemi
    settings:
      base:
        PRODUCT_NAME: YZGundemi
        PRODUCT_BUNDLE_IDENTIFIER: com.yzgundemi.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: YZGundemi/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Kendi Apple Developer ekip kimliğinizi Xcode'da Signing & Capabilities sekmesinden seçin
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
