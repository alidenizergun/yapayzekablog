# Her pazartesi 07:30 (İstanbul) geçen haftanın "Yapay zekada bu hafta" özetini yazar ve siteyi yayınlar.
# Web araması yapmaz; yalnızca sitedeki haberlere dayanır. Saat UTC'dir: 04:30 UTC = İstanbul 07:30.
name: Haftalık özet

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.digest.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Haftalık özeti yaz
        id: digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
        run: node scripts/weekly-digest.mjs

      - name: İngilizce çeviri
        if: steps.digest.outputs.changed == '1'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: |
          node scripts/translate-en.mjs --only=digests || { git clean -fdq src/content/ozetler-en; exit 1; }

      - name: Derleme kontrolü
        if: steps.digest.outputs.changed == '1'
        run: |
          if ! npm run build; then
            echo "::error::Derleme başarısız; özet geri alınıyor."
            git clean -fd src/content/ozetler src/content/ozetler-en
            exit 1
          fi

      - name: Kaydet
        if: steps.digest.outputs.changed == '1'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add src/content/ozetler src/content/ozetler-en
          git diff --cached --quiet && exit 0
          git commit -m "Haftalık özet ($(TZ=Europe/Istanbul date '+%d.%m.%Y'))"
          git pull --rebase origin "$BRANCH"
          git push

  deploy:
    needs: digest
    if: needs.digest.outputs.changed == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
