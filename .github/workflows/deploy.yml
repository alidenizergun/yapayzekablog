# Siteyi derleyip GitHub Pages'e yayınlar.
# Elle yapılan her değişiklikte (push) ve haber güncellemesinden sonra çalışır.
name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

# Varsayılan: yalnızca okuma; Pages'e yayın yetkisi yalnızca "deploy" işinde
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bilinen açığı olan bağımlılık varsa uyarı verir (yayını durdurmaz; Dependabot güncelleme önerir)
      - name: Bağımlılık güvenlik taraması
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Derle
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          PUBLIC_NEWSLETTER_ACTION: ${{ vars.NEWSLETTER_ACTION }}
          PUBLIC_REPORT_FORM_ACTION: ${{ vars.REPORT_FORM_ACTION }}
        run: npm run build

      - name: Özel domain dosyası
        if: vars.CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: printf '%s\n' "$CUSTOM_DOMAIN" > dist/CNAME

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
