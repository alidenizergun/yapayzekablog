# Siteyi derleyip GitHub Pages'e yayınlar.
# Elle yapılan her değişiklikte (push) ve haber güncellemesinden sonra çalışır.
name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

# Varsayılan: yalnızca okuma; Pages'e yayın yetkisi yalnızca "deploy" işinde
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bilinen açığı olan bağımlılık varsa uyarı verir (yayını durdurmaz; Dependabot güncelleme önerir)
      - name: Bağımlılık güvenlik taraması
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      # Markalı haber kartları: önbellekten geri yüklenir, yalnızca yeni haberlerinki üretilir (sistemdeki Chrome ile).
      # Başlık düzeltmesinden sonra tüm kartları yeniden üretmek için anahtardaki v1'i v2 yapın.
      - name: Kart önbelleği
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            public/og/haber
            public/og/news
          key: og-cards-v1-${{ github.run_id }}
          restore-keys: og-cards-v1-

      - name: Haber kartları
        continue-on-error: true
        run: node scripts/news-cards.mjs

      - name: Derle
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          PUBLIC_NEWSLETTER_ACTION: ${{ vars.NEWSLETTER_ACTION }}
          PUBLIC_REPORT_FORM_ACTION: ${{ vars.REPORT_FORM_ACTION }}
        run: npm run build

      - name: Özel domain dosyası
        if: vars.CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: printf '%s\n' "$CUSTOM_DOMAIN" > dist/CNAME

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # v4'ten beri nokta ile başlayan dosyalar varsayılan olarak atlanır; /.well-known/security.txt yayınlansın
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # IndexNow: Bing, Yandex ve diğer katılımcı arama motorlarına son haber adreslerini bildirir.
      # Anahtar herkese açık olacak şekilde tasarlanmıştır (public/0c0c22361c000ab306b8057c0f807962.txt); gizli değildir.
      - name: Arama motorlarına bildir (IndexNow)
        continue-on-error: true
        env:
          HOST: www.yzgundemi.com
          KEY: 0c0c22361c000ab306b8057c0f807962
        run: |
          sleep 60
          urls=$(curl -fsS "https://$HOST/news-sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | head -n 100)
          [ -z "$urls" ] && { echo "haber adresi yok"; exit 0; }
          body=$(jq -n --arg host "$HOST" --arg key "$KEY" --arg list "$urls" '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: ($list | split("\n") | map(select(length > 0)))}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow yanıtı: $code ($(printf '%s\n' "$urls" | wc -l) adres)"
