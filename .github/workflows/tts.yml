# Seslendirme: video dış sesleri için Türkçe metni sese çevirir.
#   elevenlabs (varsayılan): ticari lisanslı, doğal ses; ELEVENLABS_API_KEY secret'ı gerekir.
#   piper: açık kaynak, ücretsiz; Türkçe sesi CC BY-NC-SA lisanslı (ticari kullanım yok, yalnızca deneme).
# Ses dosyaları "medya" dalına yazılır; ana dal ve site etkilenmez.
name: Seslendirme

on:
  workflow_dispatch:
    inputs:
      metin:
        description: 'Okunacak cümleler, JSON dizisi: ["Birinci cümle.", "İkinci cümle."]'
        required: true
      klasor:
        description: 'medya dalında çıktı klasörü (ör. video/2026-11-22)'
        required: true
      motor:
        description: 'Ses motoru'
        type: choice
        default: elevenlabs
        options: [elevenlabs, piper]
      ses:
        description: 'ElevenLabs ses kimliği (voice_id); boş = varsayılan anlatıcı'
        default: ''
      model:
        description: 'ElevenLabs modeli (boş = eleven_multilingual_v2)'
        default: ''
      hiz:
        description: 'Piper konuşma hızı (1.0 normal)'
        default: '1.0'

permissions:
  contents: write

concurrency:
  group: medya
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seslendir (ElevenLabs)
        if: inputs.motor == 'elevenlabs'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          METIN: ${{ inputs.metin }}
          SES: ${{ inputs.ses }}
          MODEL: ${{ inputs.model }}
        run: python3 scripts/tts_elevenlabs.py "${SES:-onwK4e9ZLuTAKqWW03F9}" "$RUNNER_TEMP/ses" "$MODEL"

      - name: Piper'ı kur ve sesi indir
        if: inputs.motor == 'piper'
        run: |
          python3 -m pip install --quiet piper-tts==1.6.1
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/dfki/medium"
          curl -fsSL -o voice.onnx "$base/tr_TR-dfki-medium.onnx"
          curl -fsSL -o voice.onnx.json "$base/tr_TR-dfki-medium.onnx.json"
          curl -fsSL -o "$RUNNER_TEMP/MODEL_CARD.txt" "$base/MODEL_CARD" || true

      - name: Seslendir (Piper)
        if: inputs.motor == 'piper'
        env:
          METIN: ${{ inputs.metin }}
          HIZ: ${{ inputs.hiz }}
        run: python3 scripts/tts.py voice.onnx "$RUNNER_TEMP/ses" "$HIZ"

      - name: medya dalına kaydet
        env:
          KLASOR: ${{ inputs.klasor }}
          MOTOR: ${{ inputs.motor }}
        run: |
          case "$KLASOR" in *..*|/*|"") echo "geçersiz klasör"; exit 1;; esac
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          if git ls-remote --exit-code origin medya >/dev/null; then
            git fetch -q origin medya && git switch -q medya
          else
            git switch -q --orphan medya; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "$KLASOR/$MOTOR" && rm -f "$KLASOR/$MOTOR"/*
          cp "$RUNNER_TEMP"/ses/* "$KLASOR/$MOTOR"/
          [ "$MOTOR" = piper ] && cp "$RUNNER_TEMP/MODEL_CARD.txt" "$KLASOR/$MOTOR/SES_LISANSI.txt" 2>/dev/null || true
          git add "$KLASOR"
          git commit -q -m "Seslendirme: $KLASOR ($MOTOR)"
          git push -q origin medya
