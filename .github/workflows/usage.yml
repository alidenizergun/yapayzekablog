# Türkiye yapay zeka kullanım payları: Statcounter'ın aylık verisini çeker; değiştiyse kaydedip siteyi yayınlar.
# Ayda bir (her ayın 3'ü) ve elle çalışır. API ücreti yoktur.
name: Kullanım payları

on:
  schedule:
    - cron: '17 6 3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.u.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Statcounter verisini al
        id: u
        run: node scripts/usage-share.mjs
      - name: Kaydet
        if: steps.u.outputs.changed == '1'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add data/yz-kullanim-tr.json
          git diff --cached --quiet && exit 0
          git commit -m "Kullanım payları güncellendi (Statcounter, $(TZ=Europe/Istanbul date '+%d.%m.%Y'))"
          git pull --rebase origin "$BRANCH"
          git push

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
