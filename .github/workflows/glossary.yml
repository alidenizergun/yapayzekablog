# Sözlük genişletme: data/sozluk-terimler.txt listesinde olup henüz yazılmamış terimlerin
# Türkçe ve İngilizce açıklamalarını yazar (Batch API), derleme denetiminden geçirip yayınlar. Yalnızca elle çalıştırılır.
name: Sözlük genişletme

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'En fazla kaç terim (boş = hepsi)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Terimleri yaz
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GLOSSARY_LIMIT: ${{ inputs.limit }}
        run: node scripts/generate-glossary.mjs

      - name: Derleme denetimi
        if: steps.gen.outputs.count != '0'
        run: npm run build

      - name: Kaydet
        if: steps.gen.outputs.count != '0'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add src/lib/glossary-extra.js src/i18n/en/strings.json
          git diff --cached --quiet && exit 0
          git commit -m "Sözlük: yeni terimler ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
          git pull --rebase origin "$BRANCH"
          git push

  deploy:
    needs: write
    if: needs.write.outputs.count != '0' && needs.write.outputs.count != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
    # Yalnızca sayfaya gömülen (herkese açık) form anahtarı aktarılır; diğer gizli anahtarlar aktarılmaz
    secrets:
      REPORT_FORM_KEY: ${{ secrets.REPORT_FORM_KEY }}
