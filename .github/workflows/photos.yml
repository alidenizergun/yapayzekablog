# Fotoğraf denetimi: haber fotoğraflarının içerikle uyumunu Claude Haiku ile puanlar, uyumsuzları değiştirir
# (Unsplash → Pexels → Pixabay). Haber yazmaz. Elle çalıştırılır.
name: Fotoğraf denetimi

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Yalnızca raporla, değiştirme'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.rev.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fotoğrafları denetle
        id: rev
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node scripts/photo-review.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Derleme denetimi
        if: steps.rev.outputs.changed != '0' && steps.rev.outputs.changed != ''
        run: npm run build
      - name: Kaydet
        if: steps.rev.outputs.changed != '0' && steps.rev.outputs.changed != ''
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add src/content/haberler src/content/haberler-en public/foto
          git diff --cached --quiet && exit 0
          git commit -m "Fotoğraf denetimi: uyumsuz fotoğraflar değiştirildi ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
          git pull --rebase origin "$BRANCH"
          git push

  deploy:
    needs: review
    if: needs.review.outputs.changed != '0' && needs.review.outputs.changed != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
