# İş kolu rehberleri: src/lib/sectors.js'teki konulardan henüz yazılmamış rehberleri web araştırmasıyla yazar,
# İngilizceye çevirir, derleme denetiminden geçirip yayınlar. Yalnızca elle çalıştırılır.
# Var olan rehberlere dokunmaz; bir rehberi yeniden yazdırmak için dosyasını silip yeniden çalıştırın.
name: İş kolu rehberleri

on:
  workflow_dispatch:
    inputs:
      sectors:
        description: 'Sektörler (virgülle; boş = hepsi): hukuk,pazarlama,saglik,finans,egitim,e-ticaret,insan-kaynaklari,sanayi'
        required: false
        default: ''
      limit:
        description: 'En fazla kaç rehber (boş = hepsi)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Rehberleri yaz
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SECTORS: ${{ inputs.sectors }}
          GUIDE_LIMIT: ${{ inputs.limit }}
        run: node scripts/generate-guides.mjs

      - name: İngilizceye çevir
        if: steps.gen.outputs.count != '0'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: node scripts/translate-en.mjs --only=guides

      - name: Derleme denetimi
        if: steps.gen.outputs.count != '0'
        run: npm run build

      - name: Kaydet
        if: steps.gen.outputs.count != '0'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add src/content/rehberler src/content/rehberler-en
          git diff --cached --quiet && exit 0
          git commit -m "İş kolu rehberleri ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
          git pull --rebase origin "$BRANCH"
          git push

  deploy:
    needs: write
    if: needs.write.outputs.count != '0' && needs.write.outputs.count != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
