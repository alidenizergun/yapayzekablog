# Günde 4 güncelleme: gece tam turu + 3 ara tur. Haberleri üretir, İngilizcesini çevirir, siteyi derleyip yayınlar.
# Saatler UTC'dir (İstanbul = UTC+3). Tam saat başı GitHub'da en yoğun an olduğu için dakikalar kaydırıldı.
#   01:53 UTC = 04:53 gece turu (tam haber, 12 arama)
#   06:23 UTC = 09:23 sabah ara turu · 10:23 UTC = 13:23 öğle ara turu · 15:23 UTC = 18:23 akşam ara turu
#   Ara turlar: son 8 saatin kayda değer gelişmeleri, kısa not, 4 arama, en fazla 3 haber
# Not: GitHub zamanlanmış işleri yoğunluğa göre birkaç dakika gecikmeli başlatabilir.
name: Haber güncellemesi

on:
  schedule:
    - cron: '53 1 * * *'    # gece turu: 04:53 İstanbul, tam haber
    - cron: '23 6 * * *'    # sabah ara turu: 09:23 İstanbul
    - cron: '23 10 * * *'   # öğle ara turu: 13:23 İstanbul
    - cron: '23 15 * * *'   # akşam ara turu: 18:23 İstanbul
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Bu çalışmada en fazla kaç haber?'
        required: false
        default: '10'
      mode:
        description: 'Tur: boş = tam haber turu, ogle = öğle ara turu (kısa not)'
        required: false
        default: ''
      only_photos:
        description: 'Yalnızca eksik fotoğrafları doldur (haber üretme, Claude kullanma)'
        type: boolean
        default: false

# Varsayılan: yalnızca okuma. Yazma yetkisi yalnızca gereken işlere tek tek verilir.
permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      count: ${{ steps.news.outputs.count }}
      changed: ${{ steps.news.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Haberleri üret
        id: news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          NEWS_MODE: ${{ (github.event_name == 'schedule' && github.event.schedule != '53 1 * * *') && 'ogle' || inputs.mode || '' }}
          MAX_ARTICLES: ${{ (github.event_name == 'schedule' && github.event.schedule != '53 1 * * *') && (vars.MIDDAY_ARTICLES || '3') || inputs.max_articles || vars.MAX_ARTICLES || '10' }}
          LOOKBACK_HOURS: ${{ (github.event_name == 'schedule' && github.event.schedule != '53 1 * * *') && '8' || vars.LOOKBACK_HOURS || '26' }}
          MAX_SEARCHES: ${{ (github.event_name == 'schedule' && github.event.schedule != '53 1 * * *') && '4' || vars.MAX_SEARCHES || '12' }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          NEWS_BATCH: ${{ vars.NEWS_BATCH || 'true' }}
          EDITOR_PASS: ${{ vars.EDITOR_PASS || 'false' }}
          WEEKEND_SEARCHES: ${{ vars.WEEKEND_SEARCHES }}
          REQUIRE_REVIEW: ${{ vars.REQUIRE_REVIEW || 'false' }}
          PHOTOS_ONLY: ${{ inputs.only_photos || 'false' }}
          PHOTO_BACKFILL: ${{ vars.PHOTO_BACKFILL || '15' }}
        run: node scripts/generate-news.mjs

      # Yeni haberlerin İngilizcesi (Haiku 5.5, haber başına 1 sentin altında). Hata olursa Türkçe yayın etkilenmez.
      - name: İngilizce çeviri
        if: steps.news.outputs.count != '0' && steps.news.outputs.count != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: |
          node scripts/translate-en.mjs --only=news || { git clean -fdq src/content/haberler-en; git checkout -- src/content/haberler-en; exit 1; }

      - name: Derleme kontrolü (bozuk haber yayınlanmasın)
        if: steps.news.outputs.changed != '0'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          if ! npm run build; then
            echo "::error::Derleme başarısız; yeni haberler geri alınıyor."
            git clean -fd src/content/haberler src/content/haberler-en
            git checkout -- src/content/haberler src/content/haberler-en
            exit 1
          fi

      # Haber çıkmasa da X takip durumu kaydedilir; aynı gönderiler tekrar ücretlendirilmez.
      - name: Kaydet ve gönder
        if: always() && steps.news.outcome == 'success'
        env:
          COUNT: ${{ steps.news.outputs.count }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add src/content/haberler src/content/haberler-en data 2>/dev/null || git add src/content/haberler src/content/haberler-en
          git diff --cached --quiet && exit 0
          git commit -m "Haberler: ${COUNT} yeni haber, görseller güncellendi ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
          git pull --rebase origin "$BRANCH"
          git push

  deploy:
    needs: generate
    if: needs.generate.outputs.changed != '0'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}

  # X'te paylaşım KAPALI. Açmak için repo değişkeni X_POSTS_PER_RUN'a 1 veya daha büyük bir sayı yazın.
  tweet:
    needs: [generate, deploy]
    if: needs.deploy.result == 'success' && needs.generate.outputs.count != '0' && vars.X_POSTS_PER_RUN != '' && vars.X_POSTS_PER_RUN != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: X'te paylaş
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_POSTS_PER_RUN: ${{ vars.X_POSTS_PER_RUN || '0' }}
          X_WITH_LINK: ${{ vars.X_WITH_LINK || 'false' }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: node scripts/x-post.mjs

      - name: Kaydet
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "X paylaşım kaydı güncellendi"
          git pull --rebase origin "$BRANCH"
          git push
