# Günde 2 kez yeni yapay zeka haberlerini üretir, siteyi derleyip yayınlar.
# Saatler UTC'dir: 05:07 ve 14:07 UTC = İstanbul 08:07 ve 17:07
# Not: GitHub zamanlanmış işleri yoğunluğa göre birkaç dakika gecikmeli başlatabilir.
name: Haber güncellemesi

on:
  schedule:
    - cron: '7 5,14 * * *'
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Bu çalışmada en fazla kaç haber?'
        required: false
        default: '10'
      only_photos:
        description: 'Yalnızca eksik fotoğrafları doldur (haber üretme, Claude kullanma)'
        type: boolean
        default: false

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      count: ${{ steps.news.outputs.count }}
      changed: ${{ steps.news.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Haberleri üret
        id: news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          MAX_ARTICLES: ${{ inputs.max_articles || vars.MAX_ARTICLES || '10' }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '15' }}
          MAX_SEARCHES: ${{ vars.MAX_SEARCHES || '20' }}
          WEEKEND_SEARCHES: ${{ vars.WEEKEND_SEARCHES }}
          REQUIRE_REVIEW: ${{ vars.REQUIRE_REVIEW || 'false' }}
          PHOTOS_ONLY: ${{ inputs.only_photos || 'false' }}
          PHOTO_BACKFILL: ${{ vars.PHOTO_BACKFILL || '15' }}
        run: node scripts/generate-news.mjs

      - name: Derleme kontrolü (bozuk haber yayınlanmasın)
        if: steps.news.outputs.changed != '0'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          if ! npm run build; then
            echo "::error::Derleme başarısız; yeni haberler geri alınıyor."
            git clean -fd src/content/haberler
            git checkout -- src/content/haberler
            exit 1
          fi

      # Haber çıkmasa da X takip durumu kaydedilir; aynı gönderiler tekrar ücretlendirilmez.
      - name: Kaydet ve gönder
        if: always() && steps.news.outcome == 'success'
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add src/content/haberler data 2>/dev/null || git add src/content/haberler
          git diff --cached --quiet && exit 0
          git commit -m "Haberler: ${{ steps.news.outputs.count }} yeni haber, görseller güncellendi ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
          git pull --rebase origin ${{ github.ref_name }}
          git push

  deploy:
    needs: generate
    if: needs.generate.outputs.changed != '0'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
