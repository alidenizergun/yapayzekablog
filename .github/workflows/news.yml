# Günde 4 güncelleme: gece tam turu + 3 ara tur. Haberleri üretir, İngilizcesini çevirir, siteyi derleyip yayınlar.
# Turları cron-job.org başlatır (GitHub'ın kendi zamanlayıcısı yoğunlukta saatlerce gecikip turları atladığı için kaldırıldı):
#   00:00 İstanbul  gece turu (tam haber, 12 arama)        gövde: {"ref":"main"}
#   06:00, 12:00, 18:00 İstanbul  ara turlar (kısa not, 4 arama, en fazla 3 haber)   gövde: {"ref":"main","inputs":{"mode":"ogle"}}
# Denetim: "Haber motoru uyarısı" iki saatte bir son turu denetler; tur atlanmışsa yalnızca uyarı açar (turu kendisi başlatmaz).
# cron-job.org'daki GitHub anahtarının süresi dolarsa turlar durur; yeni anahtarı cron-job.org'daki iki işe girin.
name: Haber güncellemesi

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Bu çalışmada en fazla kaç haber?'
        required: false
        default: '10'
      mode:
        description: 'Tur: boş = gece tam turu, ogle = gün içi ara tur (kısa not)'
        required: false
        default: ''
      force:
        description: 'Son turun üzerinden 90 dakika geçmemiş olsa da çalıştır'
        type: boolean
        default: false
      only_photos:
        description: 'Yalnızca eksik fotoğrafları doldur (haber üretme, Claude kullanma)'
        type: boolean
        default: false
      engine:
        description: 'Motor: boş = repo ayarı (NEWS_ENGINE), klasik, ajan = haber masası'
        required: false
        default: ''
      shadow:
        description: 'Deneme: ajanlar çalışır, sonuç yalnızca tur özetinde görünür, siteye haber eklenmez'
        type: boolean
        default: false

# Varsayılan: yalnızca okuma. Yazma yetkisi yalnızca gereken işlere tek tek verilir.
permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      count: ${{ steps.news.outputs.count }}
      changed: ${{ steps.news.outputs.changed }}
      new_files: ${{ steps.save.outputs.new_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Haberleri üret
        id: news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # X takip listesi okuması KAPALI (tur başına ~0,13 $). Açmak için repo değişkeni X_FEED'i true yapın.
          X_BEARER_TOKEN: ${{ vars.X_FEED == 'true' && secrets.X_BEARER_TOKEN || '' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          NEWS_MODE: ${{ inputs.mode == 'ogle' && 'ogle' || '' }}
          MAX_ARTICLES: ${{ inputs.mode == 'ogle' && (vars.MIDDAY_ARTICLES || '3') || inputs.max_articles || vars.MAX_ARTICLES || '10' }}
          LOOKBACK_HOURS: ${{ inputs.mode == 'ogle' && '8' || vars.LOOKBACK_HOURS || '26' }}
          MAX_SEARCHES: ${{ inputs.mode == 'ogle' && '4' || vars.MAX_SEARCHES || '12' }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          NEWS_BATCH: ${{ vars.NEWS_BATCH || 'true' }}
          EDITOR_PASS: ${{ vars.EDITOR_PASS || 'false' }}
          MIN_GAP_MIN: ${{ inputs.force && '0' || vars.MIN_GAP_MIN || '90' }}
          WEEKEND_SEARCHES: ${{ vars.WEEKEND_SEARCHES }}
          REQUIRE_REVIEW: ${{ vars.REQUIRE_REVIEW || 'false' }}
          # Haber masası (ajanlar) varsayılan; eski yönteme dönmek için repo değişkeni NEWS_ENGINE=klasik
          NEWS_ENGINE: ${{ inputs.engine || vars.NEWS_ENGINE || 'ajan' }}
          AGENT_SHADOW: ${{ inputs.shadow && 'true' || vars.AGENT_SHADOW || 'false' }}
          AGENT_BUDGET_USD: ${{ vars.AGENT_BUDGET_USD }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          EDITOR_MODEL: ${{ vars.EDITOR_MODEL }}
          AGENT_MAX_TOPICS: ${{ vars.AGENT_MAX_TOPICS }}
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL }}
          PHOTOS_ONLY: ${{ inputs.only_photos || 'false' }}
          PHOTO_BACKFILL: ${{ vars.PHOTO_BACKFILL || '15' }}
        run: node scripts/generate-news.mjs

      # Yeni haberlerin İngilizcesi (Haiku 5.5, haber başına 1 sentin altında). Hata olursa Türkçe yayın etkilenmez.
      - name: İngilizce çeviri
        if: steps.news.outputs.count != '0' && steps.news.outputs.count != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: |
          node scripts/translate-en.mjs --only=news || { git clean -fdq src/content/haberler-en; git checkout -- src/content/haberler-en; exit 1; }

      - name: Derleme kontrolü (bozuk haber yayınlanmasın)
        if: steps.news.outputs.changed != '0'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          if ! npm run build; then
            echo "::error::Derleme başarısız; yeni haberler geri alınıyor."
            git clean -fd src/content/haberler src/content/haberler-en
            git checkout -- src/content/haberler src/content/haberler-en
            exit 1
          fi

      # Haber çıkmasa da X takip durumu kaydedilir; aynı gönderiler tekrar ücretlendirilmez.
      - name: Kaydet ve gönder
        id: save
        if: always() && steps.news.outcome == 'success'
        env:
          COUNT: ${{ steps.news.outputs.count }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add src/content/haberler src/content/haberler-en data public/foto 2>/dev/null || git add src/content/haberler src/content/haberler-en data
          git diff --cached --quiet && exit 0
          # WhatsApp bildirimi için bu turda eklenen Türkçe haberler
          echo "new_files=$(git diff --cached --name-only --diff-filter=A -- 'src/content/haberler/*.md' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          git commit -m "Haberler: ${COUNT} yeni haber, görseller güncellendi ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
          git pull --rebase origin "$BRANCH"
          git push

  # Yeni haber çıkmasa da site her turda yeniden derlenir: manşet 24 saati dolduran haberden çıkar, "x saat önce" yazıları güncellenir.
  deploy:
    needs: generate
    if: needs.generate.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
    # Yalnızca sayfaya gömülen (herkese açık) form anahtarı aktarılır; diğer gizli anahtarlar aktarılmaz
    secrets:
      REPORT_FORM_KEY: ${{ secrets.REPORT_FORM_KEY }}

  # Yeni haber yayına girince WhatsApp bildirimi (CallMeBot, kullanıcı kararı Kasım 2026).
  # Anahtarlar: CALLMEBOT_PHONE, CALLMEBOT_APIKEY (tanımlı değilse adım sessizce atlar). Kapatmak için repo değişkeni WHATSAPP_NOTIFY = false.
  whatsapp:
    needs: [generate, deploy]
    if: needs.deploy.result == 'success' && needs.generate.outputs.new_files != '' && vars.WHATSAPP_NOTIFY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: WhatsApp bildirimi
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          NEW_FILES: ${{ needs.generate.outputs.new_files }}
        run: python3 scripts/whatsapp-notify.py $NEW_FILES

  # X'te paylaşım AÇIK (kullanıcı kararı, Kasım 2026): turda 1 linksiz gönderi. Kapatmak için repo değişkeni X_POSTS_PER_RUN = 0.
  # X anahtarları tanımlı değilse betik paylaşmadan çıkar.
  tweet:
    needs: [generate, deploy]
    if: needs.deploy.result == 'success' && needs.generate.outputs.count != '0' && vars.X_POSTS_PER_RUN != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: X'te paylaş
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_POSTS_PER_RUN: ${{ vars.X_POSTS_PER_RUN || '1' }}
          X_WITH_LINK: ${{ vars.X_WITH_LINK || 'false' }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: node scripts/x-post.mjs

      - name: Kaydet
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "X paylaşım kaydı güncellendi"
          git pull --rebase origin "$BRANCH"
          git push
