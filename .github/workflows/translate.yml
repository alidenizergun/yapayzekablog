# İngilizce sürüm: eksik çevirileri üretir (veri metinleri, haberler, rehberler, haftalık özetler) ve kaydeder.
# Yalnızca elle çalıştırılır (Actions > İngilizce çeviri > Run workflow). Var olan çevirilere dokunmaz.
name: İngilizce çeviri

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Neler çevrilsin (virgülle): strings,news,guides,digests'
        required: false
        default: 'strings,news,guides,digests'
      limit:
        description: 'Her türden en fazla kaç içerik (boş = hepsi)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Çevir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
        run: node scripts/translate-en.mjs --only="${ONLY:-strings,news,guides,digests}" ${LIMIT:+--limit="$LIMIT"}

      - name: Kaydet
        id: save
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "yzgundemi-bot"
          git config user.email "yzgundemi-bot@users.noreply.github.com"
          git add src/i18n/en src/content/haberler-en src/content/rehberler-en src/content/ozetler-en
          git diff --cached --quiet && { echo "Değişiklik yok"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; }
          git commit -m "İngilizce çeviriler ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
          git pull --rebase origin "$BRANCH"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"

  # Bot'un push'u yayın iş akışını tetiklemediği için çeviriden sonra site burada yayınlanır
  deploy:
    needs: translate
    if: needs.translate.outputs.changed == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
